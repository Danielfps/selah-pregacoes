<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Selah – pausa para refletir</title>
  <meta name="description" content="Selah: registre e lembre as pregações que você ouve. Funciona offline e salva no seu Google Docs.">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15131F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Selah">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema salvo antes de desenhar (evita "piscar").
    try {
      var t = localStorage.getItem('selah.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script src="js/reminder-core.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="splash-mark"><i></i><i></i></div></div>
  <div id="app">
    <div id="banners" aria-live="polite"></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="global-rec" hidden></div>
  <nav id="nav" aria-label="Navegação principal"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">O Selah precisa do JavaScript ativado para funcionar.</p>
  </noscript>
</body>
</html>
